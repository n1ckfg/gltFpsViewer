<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLTF FPS Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="instructions" style="opacity:0.5;">
        <p style="font-size:36px">click to play</p>
        <p>
            Move: W, A, S, D<br/>
            Up/Down: Q, E<br/>
            Run: SHIFT<br/>
            Look: MOUSE<br/>
            Export Scene: O<br/>
            Pause: TAB<br/>
            <br/>
            When paused...<br/>
            Drag and drop a .glb file to load it.<br/>
            Click a model to select it.<br/>
            Press 1, 2, 3 to change transform mode.<br/>
            Arrow keys: navigate scene graph<br/>
            &uarr;&darr; parent/child &larr;&rarr; siblings<br/>
        </p>
    </div>
    
    <!-- Use import maps to resolve three.js dependencies -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
